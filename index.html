<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birthday AR - Interactive Celebration</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
    #status {
      position: fixed; z-index: 1000; top: 12px; left: 50%;
      transform: translateX(-50%); width: calc(100% - 24px); max-width: 520px;
      padding: 12px 16px; border-radius: 14px; background: #a83255;
      color: white; text-align: center; font-weight: 700;
      box-shadow: 0 4px 18px rgba(0,0,0,.22);
    }
    #help {
      position: fixed; z-index: 1000; bottom: 12px; left: 12px; right: 12px;
      padding: 11px 14px; background: rgba(39, 27, 55, .88); color: white;
      text-align: center; border-radius: 12px; font-size: 13px;
      line-height: 1.45; pointer-events: none;
    }
  </style>
  <script>
    // Tap the balloon to cycle through different colours.
    AFRAME.registerComponent('color-changer', {
      init: function () {
        const colors = ['#F45B8D', '#FFD166', '#55C1E7', '#8ED6A8', '#B78AE8'];
        let current = 0;
        this.el.addEventListener('click', () => {
          current = (current + 1) % colors.length;
          this.el.setAttribute('material', 'color', colors[current]);
        });
      }
    });

    // Tap the gift box to grow it and return it to normal size.
    AFRAME.registerComponent('gift-toggle', {
      init: function () {
        let enlarged = false;
        this.el.addEventListener('click', () => {
          enlarged = !enlarged;
          this.el.setAttribute('animation__grow', {
            property: 'scale',
            to: enlarged ? '1.35 1.35 1.35' : '1 1 1',
            dur: 350,
            easing: 'easeOutQuad'
          });
        });
      }
    });

    // Update the banner when the Hiro marker is found or lost.
    AFRAME.registerComponent('marker-status', {
      init: function () {
        const banner = document.getElementById('status');
        this.el.addEventListener('markerFound', () => {
          banner.textContent = '🎉 MARKER FOUND — Happy Birthday!';
          banner.style.background = '#23865B';
        });
        this.el.addEventListener('markerLost', () => {
          banner.textContent = 'MARKER LOST — Point your camera at the Hiro marker';
          banner.style.background = '#A83255';
        });
      }
    });
  </script>
</head>
<body>
  <div id="status">Looking for the Hiro marker...</div>
  <div id="help">Tap the pink balloon to change its colour · Tap the gift to make it bigger</div>

  <a-scene embedded
    vr-mode-ui="enabled: false"
    renderer="colorManagement: true; physicallyCorrectLights: true"
    arjs="sourceType: webcam; debugUIEnabled: false;">
    <a-assets timeout="20000">
      <a-asset-item id="birthday-cake" src="models/birthday-cake.glb"></a-asset-item>
    </a-assets>

    <a-marker preset="hiro" marker-status>
      <!-- Simple display base -->
      <a-box position="0 -0.045 0" width="2" height="0.09" depth="1.55"
        color="#F8DCE8"></a-box>

      <!-- 3D birthday cake model: original procedural GLB -->
      <a-entity gltf-model="#birthday-cake" position="0 0.02 0"
        scale="0.78 0.78 0.78"
        animation="property: rotation; from: 0 0 0; to: 0 360 0; dur: 12000; easing: linear; loop: true">
      </a-entity>

      <!-- Interactive balloon -->
      <a-entity position="-0.68 0.48 0.10"
        animation="property: position; from: -0.68 0.42 0.10; to: -0.68 0.72 0.10; dir: alternate; dur: 1100; easing: easeInOutSine; loop: true">
       <a-sphere
       class="clickable"
       color-changer
       radius="0.17"
       color="#F45B8D">
      </a-sphere>
        <a-cylinder position="0 -0.23 0" radius="0.006" height="0.30" color="#FFFFFF"></a-cylinder>
      </a-entity>

      <!-- Second decorative balloon -->
      <a-entity position="0.70 0.48 -0.05">
        <a-sphere radius="0.15" color="#62C5E8"></a-sphere>
        <a-cylinder position="0 -0.21 0" radius="0.005" height="0.27" color="#FFFFFF"></a-cylinder>
      </a-entity>

      <!-- Gift box: custom gift-toggle interaction -->
      <a-entity gift-toggle position="0.67 0.16 0.43">
        <a-box class="clickable" width="0.34" height="0.30" depth="0.30" color="#9B78D1"></a-box>
        <a-box class="clickable" position="0 0.16 0" width="0.38" height="0.045" depth="0.34" color="#F7C95B"></a-box>
        <a-box class="clickable" position="0 0 0.155" width="0.055" height="0.31" depth="0.012" color="#F7C95B"></a-box>
      </a-entity>

      <!-- Party hat made from a cone -->
      <a-cone position="-0.68 0.22 0.43" radius-bottom="0.19" radius-top="0"
        height="0.38" color="#55BFA0"></a-cone>
      <a-sphere position="-0.68 0.43 0.43" radius="0.045" color="#FFD166"></a-sphere>

      <!-- Confetti decorations -->
      <a-sphere position="-0.30 0.10 0.53" radius="0.045" color="#FFD166"></a-sphere>
      <a-box position="0.27 0.10 0.53" width="0.08" height="0.08" depth="0.08"
        color="#F48FB1" rotation="0 0 25"></a-box>

      <!-- Scene title and labels -->
      <a-text value="HAPPY BIRTHDAY!" position="0 1.22 0"
        align="center" width="3.1" color="#FFFFFF" side="double"></a-text>
      <a-text value="Make a wish!" position="0 1.02 0"
        align="center" width="2" color="#FFE28A" side="double"></a-text>
    </a-marker>

   <a-entity
  camera
  cursor="rayOrigin: mouse"
  raycaster="objects: .clickable">
</a-entity>
  </a-scene>
</body>
</html>
